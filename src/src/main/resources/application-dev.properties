# Bank Management System - Development Environment Configuration
# Author: Senior Java Full Stack Developer
# Environment: Development

# ===================================================================
# DEVELOPMENT SPECIFIC CONFIGURATION
# ===================================================================
spring.profiles.active=dev

# ===================================================================
# DATABASE CONFIGURATION (Development)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/bank_management_system_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password

# ===================================================================
# JPA/HIBERNATE CONFIGURATION (Development)
# ===================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# LOGGING CONFIGURATION (Development)
# ===================================================================
logging.level.com.bank.management=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.transaction=DEBUG

# ===================================================================
# SECURITY CONFIGURATION (Development)
# ===================================================================
# JWT Configuration - Shorter expiration for development
app.jwt.expiration=3600000
app.jwt.refresh-expiration=86400000

# ===================================================================
# CACHE CONFIGURATION (Development)
# ===================================================================
spring.cache.type=simple

# ===================================================================
# ACTUATOR CONFIGURATION (Development)
# ===================================================================
management.endpoints.web.exposure.include=*

# ===================================================================
# DEVELOPMENT BUSINESS RULES
# ===================================================================
app.business.min-balance=0.00
app.business.max-daily-transactions=100
app.business.max-transfer-amount=1000000.00

# ===================================================================
# H2 DATABASE FOR TESTING (Optional)
# ===================================================================
# Uncomment below lines to use H2 in-memory database for quick testing
# spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
