# Bank Management System - Production Environment Configuration
# Author: Senior Java Full Stack Developer
# Environment: Production

# ===================================================================
# PRODUCTION SPECIFIC CONFIGURATION
# ===================================================================
spring.profiles.active=prod

# ===================================================================
# SERVER CONFIGURATION (Production)
# ===================================================================
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# ===================================================================
# DATABASE CONFIGURATION (Production)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/bank_management_system_prod?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection Pool Configuration (Optimized for Production)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000

# ===================================================================
# JPA/HIBERNATE CONFIGURATION (Production)
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Connection Provider Configuration
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.connection.autocommit=false

# ===================================================================
# LOGGING CONFIGURATION (Production)
# ===================================================================
logging.level.com.bank.management=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework=WARN
logging.level.root=INFO

# ===================================================================
# SECURITY CONFIGURATION (Production)
# ===================================================================
# JWT Configuration - Environment variables for security
app.jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationPurposes2026!@#}
app.jwt.expiration=1800000
app.jwt.refresh-expiration=86400000

# ===================================================================
# CACHE CONFIGURATION (Production)
# ===================================================================
spring.cache.type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout=2000ms
spring.redis.database=0

# ===================================================================
# ACTUATOR CONFIGURATION (Production)
# ===================================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=true

# ===================================================================
# EMAIL CONFIGURATION (Production)
# ===================================================================
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*

# ===================================================================
# PRODUCTION BUSINESS RULES
# ===================================================================
app.business.min-balance=1000.00
app.business.max-daily-transactions=10
app.business.max-transfer-amount=100000.00

# ===================================================================
# SSL CONFIGURATION (Production)
# ===================================================================
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS}

# ===================================================================
# MONITORING AND ALERTS (Production)
# ===================================================================
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.metrics.enable.all=true